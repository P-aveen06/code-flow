[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-flow-server"
version = "0.1.0"
description = "HTTP API for code-flow"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "code-flow-analyzer",
    "flagsmith>=6.7.0",
    "urllib3",
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.uv.sources]
code-flow-analyzer = { path = "../analyzer", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
