services:
  - type: web
    name: code-flow-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CODEFLOW_WEB_ORIGIN
        sync: false
      - key: CODEFLOW_MAX_IMPORT_COMMITS
        value: "50"
      - key: CODEFLOW_SNAPSHOT_CACHE_SIZE
        value: "8"
      # Leave FLAGSMITH_API_URL unset until the public SDK endpoint is available.
      - key: CODEFLOW_FLAGSMITH_SERVER_KEY
        sync: false
      # Sign in with GitHub (docs/GITHUB_SIGNIN.md). Set all five or none.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
