[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-flow-analyzer"
version = "0.1.0"
description = "Git for code flow"
requires-python = ">=3.11"
dependencies = ["tree-sitter>=0.25", "tree-sitter-python>=0.25"]

[project.scripts]
code-flow = "codeflow.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["codeflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
